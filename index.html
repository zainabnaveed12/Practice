<!DOCTYPE html>
<html lang="en">

<head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Focus Timer | Deployment Practice</title>
            <!-- Google Fonts -->
            <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
                        rel="stylesheet">
            <!-- Custom CSS -->
            <link rel="stylesheet" href="style.css">
</head>

<body>

            <!-- Background Glow -->
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="container">
                        <div class="card glass">
                                    <h2>⚡ Focus Timer</h2>
                                    <p class="subtitle">Boost your productivity & practice deployment</p>

                                    <!-- Timer Display -->
                                    <div class="timer-display">
                                                <span id="minutes">25</span>:<span id="seconds">00</span>
                                    </div>

                                    <!-- Controls -->
                                    <div class="btn-group">
                                                <button id="startBtn" class="btn primary-btn">Start</button>
                                                <button id="pauseBtn" class="btn secondary-btn">Pause</button>
                                                <button id="resetBtn" class="btn secondary-btn">Reset</button>
                                    </div>
                        </div>

                        <footer>
                                    <p>&copy; 2026 Ready for Vercel Deployment</p>
                        </footer>
            </div>

            <!-- Custom JS -->
            <script src="script.js"></script>
</body>

</html>
